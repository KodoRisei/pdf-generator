[project]
name = "pdf-generator"
version = "0.1.0"
description = "テキストからコピー防止・隠しテキスト入りの PDF を生成するツール"
readme = "README.md"
authors = [
    { name = "Kodo Risei", email = "kodox0717@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.68.0",
    "reportlab>=5.1.0",
]

[project.scripts]
pdf-generator = "pdf_generator:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pdfminer-six>=20260107",
    "pypdf>=7.1.0",
    "pytest>=9.2.0",
]
